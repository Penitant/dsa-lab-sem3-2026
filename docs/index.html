<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Lab</title>
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --neon: #00e5ff;
    --radius: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 1.75rem 1.1rem 5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    line-height: 1.4;
  }

  header {
    max-width: 720px;
    margin: 0 auto 1.75rem;
  }

  .wordmark {
    margin: 0 0 1.25rem;
    font-size: clamp(2rem, 8vw, 2.75rem);
    font-weight: 900;
    letter-spacing: -0.02em;
  }

  nav.tabs {
    display: flex;
    gap: 0.5rem;
  }

  nav.tabs button {
    appearance: none;
    border: 2px solid var(--neon);
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-weight: 800;
    font-size: 1rem;
    padding: 0.7rem 1.25rem;
    border-radius: 999px;
    opacity: 0.45;
    transition: opacity 0.2s ease, transform 0.15s ease;
  }

  nav.tabs button.active {
    opacity: 1;
  }

  nav.tabs button:active {
    transform: scale(0.96);
  }

  main {
    max-width: 720px;
    margin: 0 auto;
  }

  section.panel {
    display: none;
  }

  section.panel.active {
    display: block;
  }

  .card {
    border: 2px solid var(--neon);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1rem;
    transition: transform 0.15s ease;
  }

  .card:active {
    transform: scale(0.99);
  }

  .chip {
    display: inline-block;
    border: 1.5px solid var(--neon);
    border-radius: 999px;
    color: var(--neon);
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.25rem 0.7rem;
    margin-bottom: 0.85rem;
  }

  .card-title {
    margin: 0 0 0.6rem;
    font-size: clamp(1.2rem, 4.5vw, 1.5rem);
    font-weight: 800;
    line-height: 1.25;
  }

  .card-category {
    margin: 0 0 1.25rem;
    font-size: 0.95rem;
    font-weight: 600;
    opacity: 0.6;
  }

  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--fg);
    text-decoration: none;
    font-weight: 800;
    font-size: 0.95rem;
    border: 2px solid var(--fg);
    border-radius: 999px;
    padding: 0.65rem 1.1rem;
    transition: transform 0.15s ease;
  }

  .card-link:active {
    transform: scale(0.95);
  }

  /* attendance */

  details.student {
    border: 2px solid var(--neon);
    border-radius: var(--radius);
    margin-bottom: 0.85rem;
    padding: 0;
    overflow: hidden;
  }

  details.student summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 1.1rem 1.25rem;
    cursor: pointer;
  }

  details.student summary::-webkit-details-marker { display: none; }

  .student-id {
    flex: 1;
    min-width: 0;
  }

  .student-roll {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    opacity: 0.55;
    letter-spacing: 0.04em;
  }

  .student-name {
    display: block;
    font-size: 1.05rem;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .student-pct {
    flex-shrink: 0;
    border: 2px solid var(--neon);
    border-radius: 999px;
    color: var(--neon);
    font-weight: 900;
    font-size: 0.95rem;
    padding: 0.35rem 0.75rem;
  }

  .weeks {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    padding: 0 1.25rem 1.25rem;
  }

  .week-dot {
    font-size: 0.7rem;
    font-weight: 800;
    border-radius: 999px;
    padding: 0.4rem 0.7rem;
    border: 1.5px solid;
  }

  .week-dot.present {
    border-color: var(--neon);
    color: var(--neon);
  }

  .week-dot.absent {
    border-color: var(--fg);
    color: var(--fg);
    opacity: 0.35;
  }

  .empty {
    border: 2px solid var(--neon);
    border-radius: var(--radius);
    padding: 2rem 1.5rem;
    font-size: 1.1rem;
    font-weight: 700;
    text-align: center;
  }

  @media (min-width: 640px) {
    body { padding: 3rem 2rem 6rem; }
    .card { padding: 2rem; }
  }
</style>
</head>
<body>
  <header>
    <h1 class="wordmark">DSA LAB</h1>
    <nav class="tabs">
      <button type="button" data-panel="assignments" class="active">Assignments</button>
      <button type="button" data-panel="attendance">Attendance</button>
    </nav>
  </header>
  <main>
    <section id="assignments" class="panel active">
      <p>Loading…</p>
    </section>
    <section id="attendance" class="panel">
      <p>Loading…</p>
    </section>
  </main>

  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, "&quot;");
    }

    async function renderAssignments() {
      const el = document.getElementById("assignments");
      let data;
      try {
        data = await (await fetch("assignments.json")).json();
      } catch (err) {
        el.innerHTML = '<p class="empty">Could not load assignments.</p>';
        return;
      }
      if (!data.length) {
        el.innerHTML = '<p class="empty">No assignments yet.</p>';
        return;
      }
      el.innerHTML = data.map(a => `
        <div class="card">
          <span class="chip">Week ${a.week}</span>
          <p class="card-title">${escapeHtml(a.title)}</p>
          <p class="card-category">${escapeHtml(a.category)}</p>
          <a class="card-link" href="${escapeAttr(a.link)}" target="_blank" rel="noopener noreferrer">Open ↗</a>
        </div>
      `).join("");
    }

    async function renderAttendance() {
      const el = document.getElementById("attendance");
      let data;
      try {
        data = await (await fetch("attendance.json")).json();
      } catch (err) {
        el.innerHTML = '<p class="empty">Could not load attendance.</p>';
        return;
      }
      if (!data.length) {
        el.innerHTML = '<p class="empty">No attendance recorded yet.</p>';
        return;
      }
      el.innerHTML = data.map(s => `
        <details class="student">
          <summary>
            <span class="student-id">
              <span class="student-roll">${escapeHtml(s.roll_no)}</span>
              <span class="student-name">${escapeHtml(s.name)}</span>
            </span>
            <span class="student-pct">${s.percent}%</span>
          </summary>
          <div class="weeks">
            ${s.weeks.map(w => `<span class="week-dot ${w.present ? "present" : "absent"}">${escapeHtml(w.date)}</span>`).join("")}
          </div>
        </details>
      `).join("");
    }

    document.querySelectorAll("nav.tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll("section.panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.panel).classList.add("active");
      });
    });

    renderAssignments();
    renderAttendance();
  </script>
</body>
</html>
