<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Lab</title>
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --grey: #8a8a8a;
    --line: #2a2a2a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 2rem 1.1rem 5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    line-height: 1.4;
  }

  header {
    max-width: 900px;
    margin: 0 auto 3rem;
  }

  .wordmark {
    margin: 0 0 2rem;
    font-size: clamp(3.5rem, 17vw, 11rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 0.85;
  }

  .wordmark span {
    display: block;
  }

  .wordmark .sem {
    font-size: 0.4em;
    color: var(--grey);
  }

  nav.tabs {
    display: flex;
    gap: 2rem;
    border-bottom: 1px solid var(--line);
  }

  nav.tabs button {
    appearance: none;
    border: none;
    background: none;
    color: var(--grey);
    font: inherit;
    font-weight: 800;
    font-size: 1.2rem;
    padding: 0 0 1rem;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  nav.tabs button.active {
    color: var(--fg);
    border-bottom-color: var(--fg);
  }

  main {
    max-width: 900px;
    margin: 0 auto;
  }

  section.panel { display: none; }
  section.panel.active { display: block; }

  .row {
    padding: 2.25rem 0;
    border-bottom: 1px solid var(--line);
  }

  .row:first-child { padding-top: 0; }

  .row-label {
    margin: 0 0 0.65rem;
    color: var(--grey);
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .row-title {
    margin: 0 0 0.5rem;
    font-size: clamp(1.5rem, 5.5vw, 2.25rem);
    font-weight: 800;
    line-height: 1.2;
  }

  .row-category {
    margin: 0 0 1.25rem;
    color: var(--grey);
    font-size: 1.15rem;
    font-weight: 500;
  }

  .row-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--fg);
    text-decoration: none;
    font-weight: 800;
    font-size: 1.15rem;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 0.1rem;
  }

  /* attendance */

  details.student {
    border-bottom: 1px solid var(--line);
  }

  details.student summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.35rem 0;
    cursor: pointer;
  }

  details.student summary::-webkit-details-marker { display: none; }

  .student-id { flex: 1; min-width: 0; }

  .student-roll {
    display: block;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--grey);
    letter-spacing: 0.03em;
  }

  .student-name {
    display: block;
    font-size: 1.4rem;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .student-pct {
    flex-shrink: 0;
    font-weight: 900;
    font-size: 1.5rem;
  }

  .weeks {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 1.1rem;
    padding: 0 0 1.75rem;
  }

  .week-dot {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--grey);
  }

  .week-dot.present { color: var(--fg); }

  .empty {
    padding: 2.5rem 0;
    color: var(--grey);
    font-size: 1.2rem;
    font-weight: 700;
  }

  @media (min-width: 640px) {
    body { padding: 3.5rem 2rem 6rem; }
  }
</style>
</head>
<body>
  <header>
    <h1 class="wordmark"><span>DSA LAB</span><span class="sem">SEM 3</span></h1>
    <nav class="tabs">
      <button type="button" data-panel="assignments" class="active">Assignments</button>
      <button type="button" data-panel="attendance">Attendance</button>
    </nav>
  </header>
  <main>
    <section id="assignments" class="panel active">
      <p class="empty">Loading…</p>
    </section>
    <section id="attendance" class="panel">
      <p class="empty">Loading…</p>
    </section>
  </main>

  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, "&quot;");
    }

    async function renderAssignments() {
      const el = document.getElementById("assignments");
      let data;
      try {
        data = await (await fetch("assignments.json")).json();
      } catch (err) {
        el.innerHTML = '<p class="empty">Could not load assignments.</p>';
        return;
      }
      if (!data.length) {
        el.innerHTML = '<p class="empty">No assignments yet.</p>';
        return;
      }
      el.innerHTML = data.map(a => `
        <div class="row">
          <p class="row-label">Week ${a.week}</p>
          <p class="row-title">${escapeHtml(a.title)}</p>
          <p class="row-category">${escapeHtml(a.category)}</p>
          <a class="row-link" href="${escapeAttr(a.link)}" target="_blank" rel="noopener noreferrer">Open ↗</a>
        </div>
      `).join("");
    }

    async function renderAttendance() {
      const el = document.getElementById("attendance");
      let data;
      try {
        data = await (await fetch("attendance.json")).json();
      } catch (err) {
        el.innerHTML = '<p class="empty">Could not load attendance.</p>';
        return;
      }
      if (!data.length) {
        el.innerHTML = '<p class="empty">No attendance recorded yet.</p>';
        return;
      }
      el.innerHTML = data.map(s => `
        <details class="student">
          <summary>
            <span class="student-id">
              <span class="student-roll">${escapeHtml(s.roll_no)}</span>
              <span class="student-name">${escapeHtml(s.name)}</span>
            </span>
            <span class="student-pct">${s.percent}%</span>
          </summary>
          <div class="weeks">
            ${s.weeks.map(w => `<span class="week-dot ${w.present ? "present" : ""}">${escapeHtml(w.date)}</span>`).join("")}
          </div>
        </details>
      `).join("");
    }

    document.querySelectorAll("nav.tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll("section.panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.panel).classList.add("active");
      });
    });

    renderAssignments();
    renderAttendance();
  </script>
</body>
</html>
