<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Lab</title>
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --grey: #8a8a8a;
    --line: #2a2a2a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 2rem 1.1rem 5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    line-height: 1.4;
  }

  header {
    max-width: 900px;
    margin: 0 auto 3rem;
  }

  .wordmark {
    margin: 0 0 2rem;
    font-size: clamp(3.5rem, 17vw, 11rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 0.85;
  }

  .wordmark span {
    display: block;
  }

  .wordmark .sem {
    font-size: 0.4em;
    color: var(--grey);
  }

  nav.tabs {
    display: flex;
    gap: 2rem;
    border-bottom: 1px solid var(--line);
  }

  nav.tabs button {
    appearance: none;
    border: none;
    background: none;
    color: var(--grey);
    font: inherit;
    font-weight: 800;
    font-size: 1.2rem;
    padding: 0 0 1rem;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  nav.tabs button.active {
    color: var(--fg);
    border-bottom-color: var(--fg);
  }

  main {
    max-width: 900px;
    margin: 0 auto;
  }

  section.panel { display: none; }
  section.panel.active { display: block; }

  .row {
    padding: 2.25rem 0;
    border-bottom: 1px solid var(--line);
  }

  .row:first-child { padding-top: 0; }

  .row-label {
    margin: 0 0 0.65rem;
    color: var(--grey);
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .row-title {
    margin: 0 0 0.5rem;
    font-size: clamp(1.5rem, 5.5vw, 2.25rem);
    font-weight: 800;
    line-height: 1.2;
  }

  .row-category {
    margin: 0 0 1.25rem;
    color: var(--grey);
    font-size: 1.15rem;
    font-weight: 500;
  }

  .row-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--fg);
    text-decoration: none;
    font-weight: 800;
    font-size: 1.15rem;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 0.1rem;
  }

  /* attendance */

  input.search {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--fg);
    font: inherit;
    font-weight: 700;
    font-size: 1.15rem;
    padding: 0 0 1rem;
    margin-bottom: 0.5rem;
  }

  input.search::placeholder { color: var(--grey); }
  input.search:focus { outline: none; border-bottom-color: var(--fg); }

  .student {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: 1.1rem 0;
    border-bottom: 1px solid var(--line);
  }

  .student-id {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 0.85rem;
  }

  .student-roll {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--grey);
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .student-name {
    font-size: 1.2rem;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .student-stats {
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    gap: 0.85rem;
  }

  .student-days {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--grey);
  }

  .student-pct {
    font-weight: 900;
    font-size: 1.3rem;
    min-width: 3.5ch;
    text-align: right;
  }

  .empty {
    padding: 2.5rem 0;
    color: var(--grey);
    font-size: 1.2rem;
    font-weight: 700;
  }

  @media (min-width: 640px) {
    body { padding: 3.5rem 2rem 6rem; }
  }
</style>
</head>
<body>
  <header>
    <h1 class="wordmark"><span>DSA LAB</span><span class="sem">SEM 3</span></h1>
    <nav class="tabs">
      <button type="button" data-panel="assignments" class="active">Assignments</button>
      <button type="button" data-panel="attendance">Attendance</button>
    </nav>
  </header>
  <main>
    <section id="assignments" class="panel active">
      <p class="empty">Loading…</p>
    </section>
    <section id="attendance" class="panel">
      <p class="empty">Loading…</p>
    </section>
  </main>

  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, "&quot;");
    }

    async function renderAssignments() {
      const el = document.getElementById("assignments");
      let data;
      try {
        data = await (await fetch("assignments.json")).json();
      } catch (err) {
        el.innerHTML = '<p class="empty">Could not load assignments.</p>';
        return;
      }
      if (!data.length) {
        el.innerHTML = '<p class="empty">No assignments yet.</p>';
        return;
      }
      el.innerHTML = data.map(a => `
        <div class="row">
          <p class="row-label">Week ${a.week}</p>
          <p class="row-title">${escapeHtml(a.title)}</p>
          <p class="row-category">${escapeHtml(a.category)}</p>
          <a class="row-link" href="${escapeAttr(a.link)}" target="_blank" rel="noopener noreferrer">Open ↗</a>
        </div>
      `).join("");
    }

    async function renderAttendance() {
      const el = document.getElementById("attendance");
      let data;
      try {
        data = await (await fetch("attendance.json")).json();
      } catch (err) {
        el.innerHTML = '<p class="empty">Could not load attendance.</p>';
        return;
      }
      if (!data.length) {
        el.innerHTML = '<p class="empty">No attendance recorded yet.</p>';
        return;
      }

      const rows = data.map(s => {
        const present = s.weeks.filter(w => w.present).length;
        const total = s.weeks.length;
        const search = escapeAttr(`${s.roll_no} ${s.name}`.toLowerCase());
        return `
          <div class="student" data-search="${search}">
            <span class="student-id">
              <span class="student-roll">${escapeHtml(s.roll_no)}</span>
              <span class="student-name">${escapeHtml(s.name)}</span>
            </span>
            <span class="student-stats">
              <span class="student-days">${present}/${total}</span>
              <span class="student-pct">${s.percent}%</span>
            </span>
          </div>
        `;
      }).join("");

      el.innerHTML = `
        <input type="search" class="search" placeholder="Search roll no. or name" autocomplete="off">
        <div class="student-list">${rows}</div>
        <p class="empty search-empty" hidden>No matches.</p>
      `;

      const input = el.querySelector(".search");
      const studentEls = [...el.querySelectorAll(".student")];
      const emptyMsg = el.querySelector(".search-empty");
      input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        let visible = 0;
        studentEls.forEach(row => {
          const match = row.dataset.search.includes(q);
          row.hidden = !match;
          if (match) visible++;
        });
        emptyMsg.hidden = visible !== 0;
      });
    }

    document.querySelectorAll("nav.tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll("section.panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.panel).classList.add("active");
      });
    });

    renderAssignments();
    renderAttendance();
  </script>
</body>
</html>
