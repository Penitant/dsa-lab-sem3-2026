name: Build attendance

on:
  workflow_run:
    workflows: ["Attendance"]
    types: [completed]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install gspread google-auth

      - name: Fetch attendance and build JSON
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          key_file="$RUNNER_TEMP/service-account.json"
          echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > "$key_file"
          GOOGLE_SERVICE_ACCOUNT_KEY_FILE="$key_file" python scripts/build_attendance.py
          rm -f "$key_file"

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- docs/attendance.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/attendance.json
          git commit -m "Update attendance dashboard data"
          git push
