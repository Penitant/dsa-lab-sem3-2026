name: Attendance

# Fires only on PR open, never on merge — merging is a separate, manual,
# later step and must never gate attendance.
on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-attendance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install gspread google-auth

      - name: Write service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          key_file="$RUNNER_TEMP/service-account.json"
          echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > "$key_file"
          echo "GOOGLE_SERVICE_ACCOUNT_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          echo "GOOGLE_SHEET_ID=$GOOGLE_SHEET_ID" >> "$GITHUB_ENV"

      - name: Look up student in roster
        id: roster
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if roll_no=$(python scripts/lookup_roster.py "$PR_AUTHOR"); then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "roll_no=$roll_no" >> "$GITHUB_OUTPUT"
          else
            gh pr comment "$PR_NUMBER" --body "GitHub username not found in the roster — attendance not recorded. Contact the instructor if this is a mistake."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get changed files
        id: files
        if: steps.roster.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --paginate -q '.[].filename' > changed_files.txt

      - name: Verify changes are within student's own folder
        id: scope
        if: steps.roster.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROLL_NO: ${{ steps.roster.outputs.roll_no }}
        run: |
          prefix="students/$ROLL_NO/"
          offending=""
          while IFS= read -r f; do
            case "$f" in
              "$prefix"*) ;;
              *) offending="$offending- $f\n" ;;
            esac
          done < changed_files.txt
          if [ -n "$offending" ]; then
            gh pr comment "$PR_NUMBER" --body "$(printf 'Changes must be within your own `%s` folder to count for attendance. Files outside that folder in this PR:\n%b' "$prefix" "$offending")"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Record submission
        if: steps.roster.outputs.found == 'true' && steps.scope.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROLL_NO: ${{ steps.roster.outputs.roll_no }}
          TZ: Asia/Kolkata
        run: |
          python scripts/mark_attendance.py "$ROLL_NO" "$(date +%F)" < changed_files.txt > result.md
          gh pr comment "$PR_NUMBER" --body-file result.md

      - name: Clean up service account key
        if: always()
        run: rm -f "$GOOGLE_SERVICE_ACCOUNT_KEY_FILE"
